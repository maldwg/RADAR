name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Sphinx documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation with warnings treated as errors
        run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html

      - name: Upload documentation preview
        uses: actions/upload-artifact@v7
        with:
          name: radar-documentation-html
          path: docs/_build/html/
          if-no-files-found: error
          retention-days: 14

# Read the Docs builds and publishes directly through its GitHub integration.
# Connect this repository once in Read the Docs; no deployment token is needed here.
