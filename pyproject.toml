[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar"
version = "0.1.0"
description = "RADAR: Reproducible Acquisition, Discovery, Assessment, and Reporting for research studies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "pypdf>=5,<7",
  "pandas>=2.3,<3",
  "matplotlib>=3.10,<4",
  "cairosvg>=2.7,<3",
]

[project.urls]
Repository = "https://github.com/maldwg/RADAR"
Documentation = "https://github.com/maldwg/RADAR/tree/main/docs"
Issues = "https://github.com/maldwg/RADAR/issues"

[project.optional-dependencies]
docs = [
  "Sphinx==8.2.3",
  "sphinx-rtd-theme==3.1.0",
]
nli = [
  "torch>=2.4,<3",
  "transformers>=4.48,<6",
  "sentencepiece>=0.2,<1",
  "protobuf>=5,<7",
]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
