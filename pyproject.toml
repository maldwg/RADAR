[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-meta"
version = "0.1.0"
description = "Reproducible GitHub and OpenAlex discovery pipelines for IDS meta-research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "pypdf>=5,<7",
  "pandas>=2.3,<3",
  "matplotlib>=3.10,<4",
  "cairosvg>=2.7,<3",
]

[project.optional-dependencies]
nli = [
  "torch>=2.4,<3",
  "transformers>=4.48,<6",
  "sentencepiece>=0.2,<1",
  "protobuf>=5,<7",
]

[project.scripts]
ids-meta = "ids_meta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
