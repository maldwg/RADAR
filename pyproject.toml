[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-meta"
version = "0.1.0"
description = "Reproducible GitHub and OpenAlex discovery pipelines for IDS meta-research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "pandas>=2.3,<3",
  "matplotlib>=3.10,<4",
]

[project.scripts]
ids-meta = "ids_meta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

