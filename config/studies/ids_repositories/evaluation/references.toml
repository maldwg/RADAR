centralization_annotation_policy = "Reference topology follows documented decision-making architecture, independently of role and IDS type. Unknown includes insufficient evidence, inapplicable tooling, and multiple equally supported architectures; unknown reference topology is not scored. CIDS/DIDS are lexical signals, not unconditional architecture labels. Sources and rationales accompany supported ratings."
benchmark_name = "GHML23 repository reference set with IDS-Meta taxonomy crosswalk"
source_repository = "https://github.com/ghml23/ghml23"
source_dataset = "https://doi.org/10.6084/m9.figshare.24793077"
