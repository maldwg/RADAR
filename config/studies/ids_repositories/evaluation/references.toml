source_secumon_count = 100
source_negative_control_count = 20
crosswalk_version = "ghml23-to-radar-v10"
taxonomy_revision = "antivirus-file-scanning-v6"
annotation_basis = "GHML23 source membership; current repository descriptions, topics, READMEs, contents, and linked official documentation reviewed 2026-10-01; traffic analyzers and all 13 prior flow_analysis annotations rechecked against official docs and source configs 2026-10-02; non-network security monitoring annotations reviewed 2026-10-02; packet/endpoint/service-log detection and enforcement boundaries rechecked 2026-10-02; BinaryAlert, Hawk, Loki, and signature-base malware-scanning/content evidence rechecked 2026-10-02; CyberDoc retains the prior demo evidence"
annotation_policy = "Source labels are retained only as provenance. Every project decision and taxonomy value is an explicit reference annotation: scope records where observation occurs, object records what evidence is analyzed, method records how detection is decided, and IDS type is selected directly rather than derived from another dimension."
adapted_accepted_count = 71
adapted_excluded_count = 47
adapted_uncertain_count = 2

[taxonomy_semantics]
centralization = "Where detection decisions are made: one logical analysis node (centralized), coordinated local analysis under managers (hierarchical), or autonomous cooperating peers without a required central coordinator (fully_distributed). This is not derived from role, scope, or system type."
observation_scopes = "Where the repository observes activity; this is independent of the evidence representation and detection method."
observation_objects = "What concrete evidence the repository analyzes as input: packets, aggregated flow/session records, logs, system calls, files, or unknown. PCAP/live capture, internal stream reconstruction, and flow export alone are packet_analysis, not flow_analysis."
detection_methods = "How the repository decides that activity is malicious or anomalous; observation objects must not appear here."
system_types = "Direct human reference annotations using the same vocabulary presented to the LLM; they are not derived from scope, object, capability, method, or role."

# This is the executable evaluation profile. The adjacent CSV is the immutable
# upstream snapshot and provenance source; it is not used as a coarse runtime
# decision mapping. Every repository below is explicitly crosswalked to the
# project taxonomy. IDS system types are explicit reference annotations using the
# same configured vocabulary presented to the LLM; they are not derived from the
# other dimensions.
# NSM represents principal security traffic analysis with limited or optional detections.
# AV represents malware file scanning; it does not imply an intrusion-system type.
# A value of "unknown" means that no configured system type is supported by the evidence.

