schema_version = "1.0"

[ensemble]
enabled = true
models = ["gemma4:31b", "qwen3.8:27b"]
threshold = 1.0

[baselines]
enabled = true
methods = ["keyword", "nli"]

[baselines.keyword]

[baselines.keyword.github]
accept_threshold = 7.0
uncertain_threshold = 4.0

[baselines.nli]
max_length = 512
premise_tokens = 384
chunk_overlap = 48
max_chunks = 6
top_k = 2
entailment_threshold = 0.5
label_margin = 0.1

[baselines.nli.sensitivity]
enabled = true
entailment_thresholds = [0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65]
label_margins = [0.0, 0.05, 0.1, 0.15, 0.2]

[baselines.llm_nli]
enabled = true
top_logprobs = 20
context_length = 4096
entailment_threshold = 0.5
label_margin = 0.1
minimum_label_mass = 0.0
