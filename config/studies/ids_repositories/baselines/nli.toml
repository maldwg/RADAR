schema_version = "1.0"
source = "github"

[fields.centralization]
mode = "exclusive"
fallback = "unknown"
[fields.centralization.hypotheses]
centralized = "This repository makes detection decisions at one central or single-node analysis engine, possibly receiving raw events from remote collectors."
hierarchical = "This repository implements hierarchical or manager-coordinated collaborative intrusion detection (CIDS), with local analysis components reporting to higher-level detection coordinators."
fully_distributed = "This repository implements fully distributed intrusion detection (DIDS), with autonomous cooperating peers and no required central detection coordinator."

# Each sentence is evaluated against repository metadata and documentation. Exclusive
# fields select one label; multilabel fields may select several; boolean fields compare
# entailment and contradiction for their single positive proposition.

[fields.role]
mode = "exclusive"
fallback = "uncertain"
[fields.role.hypotheses]
native_detector = "This repository itself implements a deployable intrusion detector that observes live or recorded runtime activity."
classifier_engine = "This repository itself implements a runnable classifier or detector that users can train or execute independently."
detection_framework = "This repository is a cohesive, extensible detection framework with its own components and ecosystem."
detection_platform = "This repository is an integration platform that orchestrates multiple distinct detection engines or security tools."
traffic_analyzer = "This repository principally implements runnable security traffic inspection, network metadata analysis, or packet forensics, with limited or optional intrusion alerting."
antivirus = "This repository principally implements runnable antivirus or malware scanning of files, uploads, binaries, archives, or cloud-storage objects, including services integrating external scanners, rather than detecting intrusions from ongoing activity."
research_project = "This repository contains a paper-linked or dataset-linked research detection project whose code is trainable or runnable."
demo = "This repository is mainly a demonstration, tutorial, example, or notebook rather than a reusable detection implementation."
rules_content = "This repository mainly distributes detection rules, signatures, policies, or other content and does not implement the engine that executes them."
support_tooling = "This repository mainly provides IDS support utilities, deployment files, integrations, or security telemetry collection, aggregation, search, monitoring, and visualization without a principal intrusion decision engine."
out_of_scope = "This repository provides no material intrusion detection, prevention, classification, antivirus or malware file scanning, security traffic or telemetry monitoring and analysis, detection content, or security support contribution."

[fields.observation_scopes]
mode = "multilabel"
fallback = "unknown"
[fields.observation_scopes.hypotheses]
network = "The implemented detection approach observes network packets, flows, sessions, or network protocols."
host_endpoint = "The implemented detection approach observes hosts or endpoints, including processes, files, system calls, or endpoint telemetry."
wireless = "The implemented detection approach observes wireless network activity."
database = "The implemented detection approach observes database activity or database queries."
provenance = "The implemented detection approach analyzes provenance graphs or provenance records."
application = "The implemented detection approach observes application-layer behavior or application protocols."
multi_scope = "The implemented detection approach combines multiple distinct observation scopes."

[fields.observation_objects]
mode = "multilabel"
fallback = "unknown"
[fields.observation_objects.hypotheses]
packet_analysis = "The implemented approach analyzes individual network packet headers or payloads."
flow_analysis = "The implemented approach reads and analyzes aggregated network-flow or session records as input, rather than merely reconstructing or exporting them from packets or PCAPs."
log_analysis = "The implemented approach analyzes operating-system, application, security, audit, or device logs."
system_calls = "The implemented approach analyzes operating-system call sequences, arguments, or frequencies."
file_analysis = "The implemented approach analyzes file content, bytes, hashes, names, or metadata, including binaries, archives, uploaded files, or cloud-storage objects, rather than merely writing files or scanning process memory."

[fields.capabilities]
mode = "multilabel"
fallback = "unknown"
[fields.capabilities.hypotheses]
detection = "The system detects malicious, anomalous, or policy-violating activity."
prevention = "The system actively blocks, contains, remediates, isolates, or otherwise prevents detected malicious activity."
monitoring = "The system continuously monitors or presents security activity."

[fields.detection_methods]
mode = "multilabel"
fallback = "unknown"
[fields.detection_methods.hypotheses]
signature_based = "The detection method matches known attack signatures, fingerprints, or byte patterns."
rule_based = "The detection method evaluates explicit detection rules, policies, expert conditions, or security queries."
anomaly_based = "The detection method identifies deviations from learned or defined normal behavior."
protocol_analysis = "The detection method uses protocol semantics or state to decide that activity is an attack or violation, beyond merely decoding or reconstructing traffic."
ml_based = "The detection method uses machine learning other than a specifically identified neural network."
nn_based = "The detection method uses a neural network, including deep neural architectures."

[fields.system_types]
mode = "multilabel"
fallback = "unknown"
[fields.system_types.hypotheses]
AV = "This system scans files, uploads, binaries, archives, or cloud-storage objects for malware using signatures, hashes, YARA rules, heuristics, or learned models; file scanning and quarantine alone do not establish a host or application intrusion detector."
NIDS = "The repository detects intrusions by inspecting network packets or protocol streams from interfaces or packet captures, directly or through an integrated packet detector."
NSM = "The repository principally implements network security monitoring or traffic analysis for investigations, possibly with limited notices or optional detection policies."
SM = "The repository principally implements collection, aggregation, search, or analysis of security logs and endpoint, application, database, cloud, or mixed-source telemetry for monitoring and investigation; intrusion decisions and alerts are optional."
NIPS = "The repository detects intrusions through network packet/interface inspection and enforces network prevention by dropping traffic or changing firewall rules."
HIDS = "The repository detects intrusions in endpoint processes, file integrity, execution, system calls, accounts, or operating-system audit activity, with local analysis or forwarding to a central manager, rather than only matching malware content in files."
HIPS = "The repository detects endpoint intrusions and enforces endpoint protection by blocking execution, terminating malicious processes, removing persistence, or disabling accounts; antivirus file scanning and quarantine alone are insufficient."
WIDS = "The repository implements a wireless intrusion detection system."
WIPS = "The repository implements a wireless intrusion prevention system."
DBIDS = "The repository implements a database intrusion detection system."
DBIPS = "The repository implements a database intrusion prevention system."
APIDS = "The repository implements an application-protocol intrusion detection system."
PIDS = "The repository implements a protocol-based intrusion detection system."
ProvIDS = "The repository implements a provenance-based intrusion detection system."
XDR = "The repository implements extended detection and response across multiple observation scopes."
IDS = "The repository implements general intrusion detection, including network-service log, authentication-failure, or aggregate-flow detection without packet intrusion inspection or endpoint activity detection, or intrusion detection with an unspecified subtype, rather than malware-content scanning alone."
IPS = "The repository implements general intrusion prevention, including service-log detection followed by source-IP bans or firewall changes, endpoint application connection-policy enforcement, or intrusion prevention with an unspecified subtype, rather than infected-file rejection or quarantine alone."
