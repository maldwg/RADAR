schema_version = "1.0"
provider = "openalex"
search_parameter = "search"
from_publication_date = "1900-01-01"
to_publication_date = "2026-10-14"
source_url = ""
window_basis = "Broad publication window for the IDS dataset catalogue."
protocol_id = "ids-openalex-boolean-search-2026-08-28"
protocol_scope = "Papers introducing IDS/security datasets, materially new dataset versions, or reusable security-data generators; surveys are traversal sources only."
query_language = "English"
named_entity_seeding = false

# Protocol search vocabulary. Named datasets and benchmark brands are forbidden so
# discovery does not privilege already-known resources. OpenAlex searches title,
# abstract, and indexed full text and supports uppercase Boolean operators, quoted
# phrases, and parenthesized synonym blocks. Queries remain well below its URL limit.
survey_queries = [
  '("intrusion detection" OR "intrusion prevention" OR "cyber attack" OR cybersecurity OR "network security" OR "malicious traffic") AND (dataset OR "data set" OR corpus OR benchmark OR testbed) AND (survey OR review OR "mapping study" OR "systematic mapping" OR taxonomy)',
  '(IoT OR IIoT OR "industrial control" OR SCADA OR automotive OR wireless OR host OR endpoint OR cloud) AND (intrusion OR attack OR security) AND (dataset OR corpus OR benchmark OR testbed) AND (survey OR review OR taxonomy OR mapping)',
]

[[queries]]
name = "direct_1"
search = "(\"intrusion detection\" OR \"intrusion prevention\" OR \"attack detection\" OR \"cyber attack\" OR cyberattack OR \"malicious activity\" OR \"malicious traffic\" OR \"security anomaly\" OR \"threat detection\") AND (dataset OR \"data set\" OR corpus OR benchmark OR testbed OR \"trace collection\" OR \"traffic collection\" OR telemetry OR logs)"

[[queries]]
name = "direct_2"
search = "(\"network attack\" OR \"network security\" OR intrusion OR malicious OR anomaly) AND (\"network traffic\" OR packet OR flow OR session OR DNS OR encrypted OR VPN OR Tor) AND (dataset OR \"data set\" OR corpus OR benchmark OR trace OR capture)"

[[queries]]
name = "direct_3"
search = "(intrusion OR attack OR malicious OR anomaly OR security) AND (host OR endpoint OR \"system call\" OR \"event log\" OR provenance OR database OR \"web application\" OR malware OR botnet) AND (dataset OR \"data set\" OR corpus OR benchmark OR telemetry OR traces)"

[[queries]]
name = "direct_4"
search = "(intrusion OR attack OR malicious OR anomaly OR security) AND (IoT OR IIoT OR \"industrial control\" OR SCADA OR \"operational technology\" OR \"smart grid\" OR automotive OR \"CAN bus\" OR wireless OR cloud OR container OR mobile) AND (dataset OR \"data set\" OR corpus OR benchmark OR testbed OR traffic OR telemetry OR logs)"

[[queries]]
name = "direct_5"
search = "(intrusion OR \"cyber attack\" OR cybersecurity OR \"network attack\" OR malicious OR security) AND (\"data generation framework\" OR \"dataset generation framework\" OR \"traffic generator\" OR \"attack generator\" OR \"generation toolkit\" OR \"testbed framework\" OR \"cyber range\" OR \"simulation framework\" OR \"emulation framework\")"

[survey_identification]
# Survey roles are traversal-only. Include the principal review-study vocabulary,
# while narrowly phrased release terms prevent obvious release papers from being
# mistaken for pure surveys.
survey_terms = [
  "survey", "systematic review", "systematic literature review", "literature review",
  "scoping review", "mapping study", "systematic mapping", "state of the art",
  "state-of-the-art review", "taxonomy of datasets", "dataset review", "overview of datasets",
]
release_terms = [
  "we introduce a dataset", "we introduce the dataset", "we present a dataset",
  "we present the dataset", "this paper introduces a dataset", "this paper presents a dataset",
  "we release a dataset", "we release the dataset", "we create and release",
  "we collected and released", "we make the dataset available", "we propose a data generation framework",
]

[survey_publishers]
# Best-effort diversity targets, never inclusion or quality criteria. The first alias
# is appended to survey searches; all aliases identify publisher families from venue
# metadata. Missing targets remain explicit in the run coverage audit.
IEEE = ["IEEE", "Institute of Electrical and Electronics Engineers"]
ACM = ["Association for Computing Machinery", "ACM"]
"Springer LNCS" = ["Lecture Notes in Computer Science", "LNCS"]
USENIX = ["USENIX", "USENIX Association"]
Elsevier = ["Elsevier", "ScienceDirect"]
Wiley = ["Wiley", "John Wiley", "Wiley-Blackwell"]

# A concept group contributes its weight once regardless of term frequency. Retrieval
# scoring is deliberately broad; final eligibility is determined only by adjudication.
[positive.security_scope]
weight = 4.0
terms = [
  "intrusion detection", "intrusion prevention", "network attack", "cyber attack",
  "cyberattack", "malicious traffic", "malicious activity", "security anomaly",
  "attack detection", "threat detection", "unauthorized access", "adversarial behavior",
]

[positive.data_artifact]
weight = 3.0
terms = [
  "dataset", "data set", "corpus", "benchmark data", "trace collection", "traffic collection",
  "event collection", "testbed data", "collected data", "captured data", "generated data",
]

[positive.original_contribution]
weight = 3.0
terms = [
  "we introduce", "we present", "we propose", "we create", "we construct", "we collect",
  "we capture", "we release", "we publish", "we provide", "we generate",
  "this paper introduces", "this paper presents", "novel dataset", "new dataset",
]

[positive.availability]
weight = 2.0
terms = [
  "publicly available", "made available", "openly available", "data repository",
  "download the dataset", "released data", "open dataset", "data availability",
]

[positive.generator]
weight = 2.0
terms = [
  "data generation framework", "dataset generation framework", "traffic generator",
  "attack generator", "testbed framework", "cyber range", "simulation framework",
  "emulation framework", "generation toolkit",
]

[positive.data_form]
weight = 1.0
terms = [
  "packet capture", "network packet", "network flow", "network traffic", "system call",
  "security log", "event log", "host telemetry", "dns traffic", "can bus", "wireless frame",
  "provenance graph", "tabular features",
]

[negative.downstream_application]
weight = -2.0
terms = [
  "trained on", "evaluated on", "tested on", "experiments on", "classification accuracy",
  "feature selection", "feature extraction", "comparative analysis", "performance comparison",
]

[negative.existing_resource_analysis]
weight = -2.0
terms = [
  "data cleaning", "dataset quality", "label errors", "class imbalance", "oversampling",
  "relabeling", "dataset characterization", "dataset comparison",
]

[negative.review]
weight = -2.0
terms = [
  "survey", "systematic review", "systematic literature review", "literature review",
  "mapping study", "taxonomy of datasets", "overview of datasets",
]

[negative.method_only]
weight = -2.0
terms = [
  "classifier", "classification model", "detection model", "prediction model",
  "performs better", "outperforms", "state of the art accuracy",
]
