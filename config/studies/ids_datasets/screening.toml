schema_version = "1.0"
protocol_id = "ids-datasets-screening-v1"
taxonomy = "taxonomy.toml"
prompt = "prompts/classification.toml"

[eligibility]
E1 = "Role and artifact type must agree: original_release or versioned_release requires dataset or dataset_and_generator; generator_release requires generator_framework or dataset_and_generator. Direct release evidence requires an explicit statement that this paper creates, introduces, releases, publishes, or makes available the concrete resource. Merely collecting temporary experimental data, generating samples only to test a model, promising future availability, or using an existing resource does not establish a released artifact."
E2 = "Papers applying, comparing, cleaning, relabeling, balancing, transforming, or evaluating existing resources are excluded unless they also release a materially new eligible resource. A derived table, feature representation, train/test split, corrected copy, or merged collection is a versioned_release only when the paper explicitly presents it as a materially new reusable release; otherwise choose dataset_analysis or downstream_application. A paper may combine survey and release contributions: when it directly introduces and releases an eligible dataset or generator, choose the applicable release role even if it also contains a survey; choose survey only when it releases no eligible resource."
E3 = "Use core only when the resource itself was created for intrusion, attack, malicious-behavior, or security-anomaly research. Use adjacent only for an original or versioned neutral traffic, log, telemetry, or trace release that is demonstrably reusable for IDS research but did not claim security intent. Generic non-security datasets are unrelated, not adjacent. A generator-only contribution cannot be adjacent under this protocol."
E4 = "Every claimed release must include a verbatim quote supporting both the paper’s creation/release contribution and the extracted resource identity. The artifact_name, artifact_display_name, or one artifact_alias must occur in that quoted evidence. If the supplied evidence does not support a concrete resource identity, choose uncertain; never infer the identity from the year, authors, or a similar known dataset. Evidence that a dataset was used is not release evidence."

[decision]
strategy = "dataset_release_validation"
