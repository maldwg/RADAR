schema_version = "1.0"
source = "openalex"

# Fixed zero-training rules over the same bounded title/abstract/full-text evidence
# supplied to the other classifiers. Scores and every matched term are exported.

[decision]
field = "paper_role"
include_labels = ["original_release", "versioned_release", "generator_release"]
exclude_labels = ["survey", "downstream_application", "dataset_analysis", "unrelated"]

[fields.paper_role]
mode = "exclusive"
fallback = "uncertain"
minimum_score = 1.0
margin = 1.0

[fields.paper_role.labels.original_release]
terms = [
  "we introduce a dataset", "we introduce the dataset", "we present a dataset",
  "we present the dataset", "we release a dataset", "we release the dataset",
  "we create and release", "we collected and released", "new intrusion detection dataset",
  "novel intrusion detection dataset", "dataset is publicly available",
]

[fields.paper_role.labels.versioned_release]
weight = 1.5
terms = [
  "new version of the dataset", "extended version of the dataset", "dataset extension",
  "successor dataset", "updated dataset", "improved version", "new release version",
]

[fields.paper_role.labels.generator_release]
weight = 1.5
terms = [
  "dataset generation framework", "data generation framework", "traffic generator",
  "attack generator", "generation toolkit", "testbed framework", "cyber range",
  "simulation framework", "emulation framework", "generate intrusion datasets",
]

[fields.paper_role.labels.survey]
weight = 1.5
terms = [
  "systematic review", "systematic literature review", "literature review", "survey of datasets",
  "dataset survey", "mapping study", "systematic mapping", "taxonomy of datasets",
  "overview of datasets", "state of the art review",
]

[fields.paper_role.labels.downstream_application]
terms = [
  "trained on", "evaluated on", "tested on", "classification accuracy", "feature selection",
  "detection model", "classification model", "outperforms", "performance comparison",
  "experiments using the dataset",
]

[fields.paper_role.labels.dataset_analysis]
terms = [
  "dataset analysis", "dataset quality", "label errors", "class imbalance", "data cleaning",
  "dataset characterization", "dataset comparison", "relabeling", "benchmark analysis",
]

[fields.paper_role.labels.unrelated]
terms = [
  "image classification", "object detection", "natural language processing",
  "medical imaging", "recommendation system", "unrelated benchmark",
]

[fields.relevance_tier]
mode = "exclusive"
fallback = "uncertain"
minimum_score = 1.0
margin = 1.0

[fields.relevance_tier.labels.core]
terms = [
  "we introduce a dataset", "we present a dataset", "we release a dataset",
  "dataset generation framework", "data generation framework", "novel dataset",
  "new intrusion detection dataset", "dataset is publicly available",
]

[fields.relevance_tier.labels.adjacent]
weight = 1.5
terms = [
  "dataset extension", "extended version", "new version of the dataset", "successor dataset",
  "updated dataset", "secondary contribution",
]

[fields.relevance_tier.labels.excluded]
terms = [
  "systematic review", "survey of datasets", "trained on", "evaluated on",
  "dataset analysis", "dataset quality", "feature selection", "classification model",
]

[fields.artifact_type]
mode = "exclusive"
fallback = "unknown"
minimum_score = 1.0
margin = 1.0

[fields.artifact_type.labels.dataset]
terms = [
  "dataset", "data set", "corpus", "benchmark dataset", "traffic traces",
  "packet captures", "data collection",
]

[fields.artifact_type.labels.generator_framework]
terms = [
  "dataset generator", "data generation framework", "dataset generation framework",
  "traffic generator", "attack generator", "generation toolkit", "testbed framework",
]

[fields.artifact_type.labels.dataset_and_generator]
weight = 2.0
terms = [
  "dataset and generator", "generator and dataset", "framework and generated dataset",
  "toolkit and dataset", "testbed and dataset",
]

[fields.domain]
