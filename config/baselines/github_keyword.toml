schema_version = "1.0"
source = "github"

# These are lexical architecture proxies, not universal acronym definitions.
# In particular, never match bare "distributed" (e.g. distributed denial of service).
[fields.centralization]
mode = "exclusive"
fallback = "unknown"
minimum_score = 1.0
margin = 1.0
[fields.centralization.labels.centralized]
terms = ["central", "centralized", "centralised", "single node", "single process", "single host", "standalone detector", "standalone IDS", "central server", "central detection engine"]
[fields.centralization.labels.hierarchical]
terms = ["hierarchical", "hierarchical IDS", "multi tier", "collaborative IDS", "collaborative intrusion detection", "CIDS", "manager agent architecture", "manager coordinated", "local detectors"]
[fields.centralization.labels.fully_distributed]
terms = ["distributed IDS", "distributed intrusion detection", "DIDS", "fully distributed", "decentralized", "decentralised", "peer to peer"]

# This is a fixed, training-free taxonomy profile. A label score is the number of
# matched concepts multiplied by its configured weight. Exclusive fields abstain
# when the winner is below minimum_score or does not clear the runner-up by margin.
# Multilabel fields retain every label reaching minimum_score.

[decision]
field = "role"
include_labels = [
  "native_detector", "classifier_engine", "detection_framework", "detection_platform",
  "traffic_analyzer", "research_project", "demo", "rules_content", "support_tooling",
]
exclude_labels = ["out_of_scope"]

[fields.role]
mode = "exclusive"
fallback = "uncertain"
minimum_score = 1.0
margin = 1.0

[fields.role.labels.native_detector]
terms = [
  "intrusion detection system", "intrusion prevention system", "intrusion detector",
  "network ids", "host ids", "wireless ids", "security sensor", "inline prevention",
]

[fields.role.labels.classifier_engine]
terms = [
  "classification engine", "classifier", "trained model", "model inference",
  "machine learning model", "deep learning model", "neural network model",
  "anomaly detector", "train the model", "run inference",
]

[fields.role.labels.detection_framework]
terms = [
  "intrusion detection framework", "detection framework", "extensible framework",
  "plugin framework", "distributed intrusion detection", "manager agent architecture",
  "server agent architecture", "detection ecosystem",
]

[fields.role.labels.detection_platform]
terms = [
  "detection platform", "security platform", "integration platform", "security operations platform",
  "multiple detection engines", "integrates detection tools", "orchestrates security tools",
  "siem platform", "security monitoring distribution",
]

