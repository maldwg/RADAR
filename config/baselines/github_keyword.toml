schema_version = "1.0"
source = "github"

# This is a fixed, training-free taxonomy profile. A label score is the number of
# matched concepts multiplied by its configured weight. Exclusive fields abstain
# when the winner is below minimum_score or does not clear the runner-up by margin.
# Multilabel fields retain every label reaching minimum_score.

[decision]
field = "role"
include_labels = [
  "native_detector", "classifier_engine", "detection_framework", "detection_platform",
  "research_project", "demo", "rules_content", "support_tooling",
]
exclude_labels = ["out_of_scope"]

[fields.role]
mode = "exclusive"
fallback = "uncertain"
minimum_score = 1.0
margin = 1.0

[fields.role.labels.native_detector]
terms = [
  "intrusion detection system", "intrusion prevention system", "intrusion detector",
  "network ids", "host ids", "wireless ids", "security sensor", "packet inspection engine",
  "network security monitor", "inline prevention",
]

[fields.role.labels.classifier_engine]
terms = [
  "classification engine", "classifier", "trained model", "model inference",
  "machine learning model", "deep learning model", "neural network model",
  "anomaly detector", "train the model", "run inference",
]

[fields.role.labels.detection_framework]
terms = [
  "intrusion detection framework", "detection framework", "extensible framework",
  "plugin framework", "distributed intrusion detection", "manager agent architecture",
  "server agent architecture", "detection ecosystem",
]

[fields.role.labels.detection_platform]
terms = [
  "detection platform", "security platform", "integration platform", "security operations platform",
  "multiple detection engines", "integrates detection tools", "orchestrates security tools",
  "siem platform", "security monitoring distribution",
]

[fields.role.labels.research_project]
terms = [
  "research code", "research implementation", "paper implementation", "code for the paper",
  "reproduce the paper", "reproduction package", "experimental implementation",
  "research prototype", "dataset linked project",
]

[fields.role.labels.demo]
terms = [
  "jupyter notebook", "notebook demo", "demonstration", "tutorial", "example project",
  "sample application", "educational example", "walkthrough",
]

[fields.role.labels.rules_content]
terms = [
  "detection rules", "security rules", "signature collection", "intrusion signatures",
  "sigma rules", "yara rules", "suricata rules", "snort rules", "detection content",
  "rule repository",
]

[fields.role.labels.support_tooling]
terms = [
  "support tool", "parser", "rule converter", "dashboard", "visualization",
  "integration plugin", "deployment files", "helm chart", "docker compose",
  "log shipper", "management console", "configuration utility",
]

[fields.role.labels.out_of_scope]
weight = 1.5
terms = [
  "awesome list", "curated list", "reading list", "bibliography", "lecture notes",
  "vulnerability scanner", "port scanner", "secret scanner", "exploit framework",
  "penetration testing toolkit", "dataset only", "uptime monitor",
  "application performance monitoring", "network management system",
]

[fields.observation_scopes]
mode = "multilabel"
fallback = "unknown"
minimum_score = 1.0

[fields.observation_scopes.labels.network]
terms = [
  "network traffic", "network packet", "packet capture", "packet inspection", "network flow",
  "flow record", "network session", "dns traffic", "network intrusion", "network ids",
]

[fields.observation_scopes.labels.host_endpoint]
terms = [
  "host intrusion", "host ids", "endpoint", "host event", "system call", "process activity",
  "file activity", "file integrity", "endpoint telemetry", "operating system audit",
]

[fields.observation_scopes.labels.wireless]
terms = ["wireless", "wifi", "wi fi", "802.11", "wireless frame", "wids", "wips"]

[fields.observation_scopes.labels.database]
terms = ["database activity", "database query", "sql query", "database intrusion", "dbids"]

[fields.observation_scopes.labels.provenance]
terms = ["provenance graph", "provenance record", "data provenance", "audit graph"]

[fields.observation_scopes.labels.application]
