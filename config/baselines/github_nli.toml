schema_version = "1.0"
source = "github"

# Each sentence is evaluated against repository metadata and documentation. Exclusive
# fields select one label; multilabel fields may select several; boolean fields compare
# entailment and contradiction for their single positive proposition.

[fields.role]
mode = "exclusive"
fallback = "uncertain"
[fields.role.hypotheses]
native_detector = "This repository itself implements a deployable intrusion detector that observes live or recorded runtime activity."
classifier_engine = "This repository itself implements a runnable classifier or detector that users can train or execute independently."
detection_framework = "This repository is a cohesive, extensible detection framework with its own components and ecosystem."
detection_platform = "This repository is an integration platform that orchestrates multiple distinct detection engines or security tools."
research_project = "This repository contains a paper-linked or dataset-linked research detection project whose code is trainable or runnable."
demo = "This repository is mainly a demonstration, tutorial, example, or notebook rather than a reusable detection implementation."
rules_content = "This repository mainly distributes detection rules, signatures, policies, or other content and does not implement the engine that executes them."
support_tooling = "This repository mainly provides supporting utilities, parsers, visualizations, deployment files, or integrations for a separate detector."
out_of_scope = "This repository does not itself provide an intrusion detection, prevention, classification, or detection-framework approach."

[fields.observation_scopes]
mode = "multilabel"
fallback = "unknown"
[fields.observation_scopes.hypotheses]
network = "The implemented detection approach observes network packets, flows, sessions, or network protocols."
host_endpoint = "The implemented detection approach observes hosts or endpoints, including processes, files, system calls, or endpoint telemetry."
wireless = "The implemented detection approach observes wireless network activity."
database = "The implemented detection approach observes database activity or database queries."
provenance = "The implemented detection approach analyzes provenance graphs or provenance records."
application = "The implemented detection approach observes application-layer behavior or application protocols."
multi_scope = "The implemented detection approach combines multiple distinct observation scopes."

[fields.observation_objects]
mode = "multilabel"
fallback = "unknown"
[fields.observation_objects.hypotheses]
packet_analysis = "The implemented approach analyzes individual network packet headers or payloads."
flow_analysis = "The implemented approach analyzes aggregated network flows, sessions, NetFlow, or IPFIX records."
log_analysis = "The implemented approach analyzes operating-system, application, security, audit, or device logs."
system_calls = "The implemented approach analyzes operating-system call sequences, arguments, or frequencies."

[fields.capabilities]
mode = "multilabel"
fallback = "unknown"
[fields.capabilities.hypotheses]
detection = "The system detects malicious, anomalous, or policy-violating activity."
prevention = "The system actively blocks, contains, remediates, isolates, or otherwise prevents detected malicious activity."
monitoring = "The system continuously monitors or presents security activity."

[fields.detection_methods]
mode = "multilabel"
fallback = "unknown"
[fields.detection_methods.hypotheses]
signature_based = "The detection method matches known attack signatures, fingerprints, or byte patterns."
rule_based = "The detection method evaluates explicit detection rules, policies, expert conditions, or security queries."
anomaly_based = "The detection method identifies deviations from learned or defined normal behavior."
protocol_analysis = "The detection method analyzes protocol semantics, state, or valid protocol behavior."
ml_based = "The detection method uses machine learning other than a specifically identified neural network."
nn_based = "The detection method uses a neural network, including deep neural architectures."

[fields.system_types]
mode = "multilabel"
fallback = "unknown"
[fields.system_types.hypotheses]
NIDS = "The repository implements a network intrusion detection system."
NIPS = "The repository implements a network intrusion prevention or network detection-and-response system."
HIDS = "The repository implements a host intrusion detection system."
HIPS = "The repository implements a host intrusion prevention or endpoint detection-and-response system."
WIDS = "The repository implements a wireless intrusion detection system."
WIPS = "The repository implements a wireless intrusion prevention system."
DBIDS = "The repository implements a database intrusion detection system."
DBIPS = "The repository implements a database intrusion prevention system."
APIDS = "The repository implements an application-protocol intrusion detection system."
PIDS = "The repository implements a protocol-based intrusion detection system."
ProvIDS = "The repository implements a provenance-based intrusion detection system."
XDR = "The repository implements extended detection and response across multiple observation scopes."
IDS = "The repository implements an intrusion detection system whose subtype is not established."
IPS = "The repository implements an intrusion prevention system whose subtype is not established."
