# Generic concepts only. Named datasets and benchmark names are forbidden.
direct_queries = [
  "intrusion detection dataset",
  "network attack traffic dataset",
  "cybersecurity dataset intrusion detection",
  "host intrusion detection dataset system calls",
  "wireless intrusion detection dataset",
  "malicious network traffic corpus",
  "network attack traffic generation framework",
  "network anomaly traffic generation",
  "benchmark dataset intrusion detection",
  
]
survey_queries = [
  "intrusion detection datasets survey",
  "network security datasets review",
  "cyber attack datasets systematic review",
]

[survey_identification]
# A work is a survey when its type is review or it contains one of these terms.
survey_terms = ["survey", "systematic review", "literature review", "dataset review", "mapping study"]
# A matching release term prevents a survey false-positive for papers releasing resources.
release_terms = [
  "new dataset", "present a dataset", "presents a dataset", "introduce a dataset", "introduces a dataset",
  "release a dataset", "release the dataset", "released dataset", "public dataset", "publicly available",
  "made available", "open source", "open-source", "dataset toolkit", "data generation framework",
]

[positive.security_scope]
weight = 4.0
terms = ["intrusion detection", "network attack", "cyber attack", "malicious traffic", "security anomaly", "attack detection"]

[positive.data_artifact]
weight = 3.0
terms = ["dataset", "data set", "corpus", "testbed", "collected data", "gathered data", "captured"]

[positive.release]
weight = 2.0
terms = ["release", "present a dataset", "new dataset", "generated", "publicly available", "data generation framework", "novel dataset", "publish"]

[positive.network_traffic]
weight = 1.0
terms = ["packet", "network flow", "network traffic", ]

[negative.downstream]
weight = -3.0
terms = ["feature selection", "classification accuracy", "trained on", "evaluated on", "comparative analysis", "oversampling"]

[negative.review]
weight = -4.0
terms = ["survey", "systematic review", "literature review", "taxonomy of datasets"]


[negative.classifier]
weight = -2.0
terms = ["classifier", "performs better", "benchmark", "exceeds", "outperforms" ]
