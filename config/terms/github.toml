# Generic concepts only. Named repositories, vendors, and products are forbidden.
search_queries = [
  "intrusion detection system",
  "intrusion prevention system",
  "network detection response",
  "network security monitoring",
  "host intrusion detection",
  "wireless intrusion detection",
  "database intrusion detection",
  "malicious traffic detection",
  "attack detection network traffic",
  "security anomaly detection logs",
  "IDS",
  "Attack detection",
  "Intrusion Prevention System",
  "HIDS",
  "NIDS",
  "PIDS",
  "DBIDS",
  "ANIDS",
  "NDR",
  "EDR",
  "XDR",
  "Hybrid IDS",
  "SIEM",
  "Intrusion Detection System in:readme",
  "Intrusion Prevention System in:readme",

]

[positive.security_scope]
weight = 3.0
terms = ["intrusion", "attack detection", "unauthorized behavior", "malicious", "bengin", "detection"]

[positive.detector_identity]
weight = 4.0
terms = ["intrusion detection system", "intrusion prevention system", "network detection and response", "host intrusion detection", "network intrusion detection", "security sensor", "ndr", "edr", "xdr", "ids", "ips"]

[positive.observation]
weight = 2.0
terms = ["network traffic", "packet capture", "network flow", "audit log", "system call", "host event", "wireless traffic", "database query", "monitor", "observe", "check"]

[positive.operational]
weight = 2.0
terms = ["install", "deploy", "run", "daemon", "sensor", "engine", "container", "command line"]

[negative.unrelated]
weight = -4.0
terms = ["vulnerability scanner", "secret scanner", "awesome list", "course assignment", "offensive tool", "exploit collection", "threat detection", "classifier", "notebook", "demo"]

