schema_version = "1.0"

# The LLM selects one or more system types directly from this controlled
# vocabulary. These definitions are included in the classification prompt and
# fingerprint. They are not post-hoc rules over scope, capability, method, or
# observation object. The LLM also selects one primary type from its selected
# system_types; use "unknown" when the evidence supports no configured type.

[types.NIDS]
name = "Network intrusion detection system"
description = "Detects intrusions by observing network communications, traffic, packets, flows, sessions, protocols, or network infrastructure."

[types.NIPS]
name = "Network intrusion prevention system / network detection and response"
description = "Detects network threats and actively blocks, contains, or responds to them."

[types.HIDS]
name = "Host intrusion detection system"
description = "Detects intrusions by observing files, processes, events, system calls, or workload state on hosts or endpoints."

[types.HIPS]
name = "Host intrusion prevention system / endpoint detection and response"
description = "Detects host or endpoint threats and actively blocks, contains, remediates, isolates, or responds to them."

[types.WIDS]
name = "Wireless intrusion detection system"
description = "Detects intrusions by observing Wi-Fi, cellular, sensor, radio, ad-hoc, or other wireless activity."

[types.WIPS]
name = "Wireless intrusion prevention system"
description = "Detects wireless threats and actively blocks or prevents them."

[types.DBIDS]
name = "Database intrusion detection system"
description = "Detects malicious or anomalous database queries, transactions, audit events, or state changes."

[types.DBIPS]
name = "Database intrusion prevention system"
description = "Detects database threats and actively blocks or prevents them."

[types.APIDS]
name = "Application-protocol intrusion detection system"
description = "Detects intrusions in application-layer requests, APIs, services, middleware, application protocols, or application events."

[types.PIDS]
name = "Protocol-based intrusion detection system"
description = "Detects protocol violations or attacks through explicit stateful or semantic protocol analysis; PIDS always has this meaning in this catalogue."

[types.ProvIDS]
name = "Provenance-based intrusion detection system"
description = "Detects intrusions using information-flow or system-provenance graphs and event lineage."

[types.XDR]
name = "Extended detection and response"
description = "Combines detection and active response across materially different observation scopes."

[types.IDS]
name = "Intrusion detection system"
description = "Detects intrusions, but the evidence does not support a more specific configured system type."

[types.IPS]
name = "Intrusion prevention system"
description = "Detects and prevents intrusions, but the evidence does not support a more specific configured system type."
