schema_version = "1.0"
source = "github"
classification_fields = ["role", "observation_scopes", "capabilities", "detection_methods"]

# Stratified benchmark design (28 entities):
# - 16 expected inclusions and 12 expected exclusions.
# - Two inclusions for each eligible repository role.
# - Every concrete observation scope and detection method occurs at least once.
# - Exclusions are split into four three-item boundary families: generic monitors,
#   offensive/scanning tools, curated/tutorial content, and name collisions.
# This is a stratified accuracy benchmark, not an estimate of class prevalence.

# Included: native detectors (2)

[[entities]]
repository = "OISF/suricata"
decision = "accept"
role = "native_detector"
observation_scopes = ["network"]
capabilities = ["detection", "prevention", "monitoring"]
detection_methods = ["signature_based", "rule_based", "protocol_analysis", "packet_analysis", "flow_analysis"]

