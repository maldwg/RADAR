# This is the executable evaluation profile. The adjacent CSV is the immutable
# upstream snapshot and provenance source; it is not used as a coarse runtime
# decision mapping. Every repository below is explicitly crosswalked to the
# project taxonomy. IDS system types are explicit reference annotations using the
# same configured vocabulary presented to the LLM; they are not derived from the
# other dimensions.
